[NEAR-RIC]
NEAR_RIC_IP = 127.0.0.1
# Port the E2 agents connect to. Set it to the E2AP port of the
# nearRT-RIC in use, e.g. 36422 for the O-RAN SC nearRT-RIC.
E2AP_PORT = 36421
# Port the xApps connect to.
E42_PORT = 36422
# E2 agent: how fast a nearRT-RIC that went away without an SCTP SHUTDOWN is
# noticed. The association is declared lost after SCTP_MAX_RETRANS
# retransmissions, each waiting at most SCTP_RTO_MAX_MS. Uncomment to change
# the defaults shown.
# SCTP_HB_INTERVAL_MS = 1000
# SCTP_RTO_MAX_MS = 2000
# SCTP_MAX_RETRANS = 5

[XAPP]
DB_DIR = /tmp/
