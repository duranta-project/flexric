services:
    nearRT-RIC:
        image: oai-flexric:dev
        command: "stdbuf -o0 nearRT-RIC"
        container_name: nearRT-RIC
        networks:
            e2_net:
                ipv4_address: 192.168.72.154
        volumes:
            - ./flexric.conf:/usr/local/etc/flexric/flexric.conf

    xapp-viavi-kpm:
        image: oai-flexric:dev
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/viavi/xapp_viavi_kpm"
        container_name: xapp-viavi-kpm
        depends_on:
            - nearRT-RIC
        networks:
            e2_net:
                ipv4_address: 192.168.72.155
        volumes:
            - ./flexric.conf:/usr/local/etc/flexric/flexric.conf

    xapp-viavi-rc:
        image: oai-flexric:dev
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/viavi/xapp_viavi_rc"
        container_name: xapp-viavi-rc
        depends_on:
            - nearRT-RIC
        networks:
            e2_net:
                ipv4_address: 192.168.72.156
        volumes:
            - ./flexric.conf:/usr/local/etc/flexric/flexric.conf

    xapp-viavi-kpm-rc:
        image: oai-flexric:dev
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/viavi/xapp_viavi_kpm_rc"
        container_name: xapp-viavi-kpm-rc
        depends_on:
            - nearRT-RIC
        networks:
            e2_net:
                ipv4_address: 192.168.72.157
        volumes:
            - ./flexric.conf:/usr/local/etc/flexric/flexric.conf

networks:
    e2_net:
        driver: bridge
        name: oai-e2-net
        ipam:
            config:
                - subnet: 192.168.72.0/24
        driver_opts:
            com.docker.network.bridge.name: "e2"
