<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'Helvetica Neue', Arial, sans-serif;
            font-size: 15px;
            color: #24292f;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, b, strong {
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* Header Styling */
        .table thead th {
            background-color: #009ee0;
            color: white;
            text-align: center;
            vertical-align: middle !important;
            border: 1px solid #007bb0 !important;
            padding: 10px;
            font-size: 16px;
        }

        /* Global Cell Alignment */
        .table-bordered td {
            border: 1px solid #dee2e6 !important;
            vertical-align: middle !important;
            padding: 8px 12px;
        }
        .test-table {
            margin-bottom: 0;
        }
        .test-table td {
            padding: 12px;
        }
        .bg-index {
            background-color: #eef7ff !important;
            text-align: center;
            color: #000;
            font-weight: bold;
        }
        .bg-status-ok {
            background-color: #90EE90 !important;
            text-align: center;
            color: #000;
        }

        .bg-status-fail {
            background-color: #f07a70 !important;
            text-align: center;
            color: #000 !important;
        }

        .col-options {
            text-align: center;
        }

        .stats-data {
            white-space: pre-wrap;
            margin: 0;
            font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas,
                         'Liberation Mono', monospace;
            line-height: 1.45;
            background: none;
            border: none;
            padding: 0;
            text-align: left;
            font-size: 13.5px;
        }

        .container { width: auto; max-width: 95%; margin-bottom: 50px; }

        /* Final Result Alignment */
        .git-info td {
            padding: 0 !important;
            font-weight: 400;
            vertical-align: middle;
        }

        /* Final Result */
        .final-wrapper {
            margin-top: 14px;
        }
        .final-result-table {
            width: 100%;
        }
        .final-result-table th {
            border: 1px solid #dee2e6 !important;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            vertical-align: middle !important;
            padding: 8px 12px;
        }
        .final-result-table .final-label {
            background-color: #33CCFF;
            width: 66%;
        }

        .final-result-table .bg-status-ok {
            background-color: green !important;
            color: #fff !important;
        }
        .final-result-table .bg-status-fail {
            background-color: red !important;
            color: #fff !important;
        }
    </style>
</head>
<body>
  <div class="container-fluid" style="margin-left:1em; margin-right:1em">
  <table width = "100%" style="border-collapse: collapse; border: none;">
   <tr style="border-collapse: collapse; border: none;">
   <td style="border-collapse: collapse; border: none; vertical-align: middle; padding: 4px 24px 4px 0;">
     <a href="http://www.openairinterface.org/">
        <img src="https://raw.githubusercontent.com/duranta-project/governance/main/logos/Duranta-Logo-Color.png" alt="Duranta" style="height: 50px; width: auto; border: 0; display: block;">
     </a>
   </td>
   <td style="border-collapse: collapse; border: none; vertical-align: middle;">
     <b><font size = "6">Job Summary -- Job: JOB_NAME -- Build-ID: <a href="BUILD_URL">BUILD_ID</a></font></b>
   </td>
   </tr>
  </table>
  <br>
GIT_INFO
<div class="container">
    <div class="table-responsive">
        <table class="table table-bordered test-table">
            <thead>
                <tr>
                    <th style="width: 10%;">Test Index</th>
                    <th style="width: 25%;">Description</th>
                    <th style="width: 20%;">Options</th>
                    <th style="width: 10%;">Status</th>
                    <th style="width: 35%;">Info</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="bg-index">{{ test_index }}</td>
                    <td>{{ description }}</td>
                    <td class="col-options">{{ options }}</td>
                    <td class="{{ status_class }}">{{ status }}</td>
                    <td>{{ info_content }}</td>
                </tr>
                </tbody>
        </table>
    </div>

    <div class="final-wrapper">
        <table class="table table-bordered final-result-table">
            <tbody>
                <tr>
                    <th class="final-label">Final Status</th>
                    <th class="{{ final_status_class }}">{{ final_status }}</th>
                </tr>
            </tbody>
        </table>
    </div>
</div>

  <div class="well well-lg">End of Test Report -- Copyright <span class="glyphicon glyphicon-copyright-mark"></span> 2026 <a href="http://www.openairinterface.org/">OpenAirInterface</a>. All Rights Reserved.</div>
</div>

</body>
</html>
